openapi: 3.0.3
info:
  title: Suittrip Server API
  version: 1.0.0
  description: |
    Suittrip 백엔드 API 명세서입니다.
    - 기준: 현재 src/app.js에 실제 마운트된 라우트
    - /api/t 라우트는 제거된 상태
servers:
  - url: http://localhost:3000
    description: Local
  - url: https://api.lifeistravel.io
    description: Production
tags:
  - { name: Health }
  - { name: Store Auth }
  - { name: Customer Auth }
  - { name: Customer Stores }
  - { name: Customer Reservations }
  - { name: Customer Coupons }
  - { name: Store }
  - { name: Store Coupon Policies }
  - { name: Storages }
  - { name: Reservations }
  - { name: Checkins }
  - { name: Dashboard }
  - { name: Statistics }
  - { name: Notifications }
  - { name: Reviews }
  - { name: Payments }
  - { name: Webhooks }
  - { name: Settlements }

paths:
  /health:
    get:
      tags: [Health]
      summary: 헬스체크
      responses:
        '200':
          description: 서버 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Server is running }
                  timestamp: { type: string, format: date-time }
                  database: { type: string, example: connected }
                  environment: { type: string, example: development }
                  version: { type: string, example: 1.0.0 }

  /api/auth/email/send-verification:
    post:
      tags: [Store Auth]
      summary: 이메일 인증코드 발송
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailSendVerificationRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }

  /api/auth/email/verify-code:
    post:
      tags: [Store Auth]
      summary: 이메일 인증코드 검증
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailVerifyCodeRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }

  /api/auth/register:
    post:
      tags: [Store Auth]
      summary: 점포 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreRegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }

  /api/auth/login:
    post:
      tags: [Store Auth]
      summary: 점포 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreLoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /api/auth/logout:
    post:
      tags: [Store Auth]
      summary: 점포 로그아웃
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }

  /api/auth/refresh:
    post:
      tags: [Store Auth]
      summary: 점포 Access Token 갱신
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /auth/social-login:
    post:
      tags: [Customer Auth]
      summary: 고객 소셜 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerSocialLoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }

  /auth/signup:
    post:
      tags: [Customer Auth]
      summary: 고객 가입 완료(온보딩)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerSignupRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }

  /auth/refresh:
    post:
      tags: [Customer Auth]
      summary: 고객 Access Token 갱신
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /auth/logout:
    post:
      tags: [Customer Auth]
      summary: 고객 로그아웃
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }

  /auth/me:
    get:
      tags: [Customer Auth]
      summary: 고객 내 정보 조회
      security:
        - CustomerBearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /api/customer/stores:
    get:
      tags: [Customer Stores]
      summary: 고객용 매장 목록 조회
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: keyword
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }

  /api/customer/stores/{storeId}:
    get:
      tags: [Customer Stores]
      summary: 고객용 매장 상세 조회
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /api/customer/reservations:
    get:
      tags: [Customer Reservations]
      summary: 고객 예약 목록 조회
      security:
        - CustomerBearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: storeId
          schema: { type: string }
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Customer Reservations]
      summary: 고객 예약 생성
      security:
        - CustomerBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /api/customer/reservations/{id}:
    get:
      tags: [Customer Reservations]
      summary: 고객 예약 단건 조회
      security:
        - CustomerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservationIdPath'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /api/customer/reservations/{id}/checkout:
    put:
      tags: [Customer Reservations]
      summary: 고객 체크아웃 처리
      security:
        - CustomerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservationIdPath'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /api/customer/coupons/claim:
    post:
      tags: [Customer Coupons]
      summary: 고객 쿠폰 수동 발급
      security:
        - CustomerBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponClaimRequest' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }

  /api/customer/coupons:
    get:
      tags: [Customer Coupons]
      summary: 고객 쿠폰 목록 조회
      security:
        - CustomerBearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [active, used, expired] }
        - in: query
          name: type
          schema: { type: string, enum: [payment_discount, store_benefit] }
        - in: query
          name: storeId
          schema: { type: string }
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /api/customer/coupons/stats:
    get:
      tags: [Customer Coupons]
      summary: 고객 쿠폰 통계 조회
      security:
        - CustomerBearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /api/customer/coupons/{id}:
    get:
      tags: [Customer Coupons]
      summary: 고객 쿠폰 상세 조회
      security:
        - CustomerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CouponIdPath'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /api/customer/coupons/{id}/use:
    post:
      tags: [Customer Coupons]
      summary: 고객 쿠폰 사용 처리
      security:
        - CustomerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CouponIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponUseRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /api/store/status:
    get:
      tags: [Store]
      summary: 매장 상태 조회
      security:
        - StoreBearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
    put:
      tags: [Store]
      summary: 매장 상태 변경
      security:
        - StoreBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreStatusUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }

  /api/store/open:
    post:
      tags: [Store]
      summary: 매장 오픈(alias)
      security:
        - StoreBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreStatusUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }

  /api/store/close:
    post:
      tags: [Store]
      summary: 매장 클로즈(alias)
      security:
        - StoreBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreStatusUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }

  /api/store:
    get:
      tags: [Store]
      summary: 매장 기본 정보 조회
      security:
        - StoreBearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    put:
      tags: [Store]
      summary: 매장 기본 정보 수정
      security:
        - StoreBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreInfoUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }

  /api/store/settings:
    get:
      tags: [Store]
      summary: 매장 설정 조회
      security:
        - StoreBearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
    put:
      tags: [Store]
      summary: 매장 설정 수정(운영/보관함/알림/카테고리)
      security:
        - StoreBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreSettingsUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }

  /api/store/coupons/policies:
    post:
      tags: [Store Coupon Policies]
      summary: 쿠폰 정책 생성
      security:
        - StoreBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponPolicyCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
    get:
      tags: [Store Coupon Policies]
      summary: 쿠폰 정책 목록 조회
      security:
        - StoreBearerAuth: []
      parameters:
        - in: query
          name: enabled
          schema: { type: boolean }
        - in: query
          name: type
          schema: { type: string, enum: [payment_discount, store_benefit] }
        - in: query
          name: autoIssueOn
          schema: { type: string, enum: [manual_claim, signup, checkin_completed] }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }

  /api/store/coupons/policies/{id}:
    get:
      tags: [Store Coupon Policies]
      summary: 쿠폰 정책 상세 조회
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PolicyIdPath'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    put:
      tags: [Store Coupon Policies]
      summary: 쿠폰 정책 수정
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PolicyIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponPolicyUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      tags: [Store Coupon Policies]
      summary: 쿠폰 정책 삭제
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PolicyIdPath'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /api/storages:
    get:
      tags: [Storages]
      summary: 보관함 목록 조회
      security:
        - StoreBearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string }
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
    post:
      tags: [Storages]
      summary: 보관함 생성
      security:
        - StoreBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorageCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }

  /api/storages/{id}:
    get:
      tags: [Storages]
      summary: 보관함 단건 조회
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StorageIdPath'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    put:
      tags: [Storages]
      summary: 보관함 수정
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StorageIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorageUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      tags: [Storages]
      summary: 보관함 삭제
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StorageIdPath'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /api/reservations:
    post:
      tags: [Reservations]
      summary: 예약 생성(매장)
      security:
        - StoreBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
    get:
      tags: [Reservations]
      summary: 예약 목록 조회(매장)
      security:
        - StoreBearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: customerId
          schema: { type: string }
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }

  /api/reservations/{id}:
    get:
      tags: [Reservations]
      summary: 예약 단건 조회(매장)
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservationIdPath'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /api/reservations/{id}/approve:
    put:
      tags: [Reservations]
      summary: 예약 승인 + 보관함 자동 할당
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservationIdPath'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }

  /api/reservations/{id}/reject:
    put:
      tags: [Reservations]
      summary: 예약 거절
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservationIdPath'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }

  /api/reservations/{id}/cancel:
    put:
      tags: [Reservations]
      summary: 예약 취소
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservationIdPath'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }

  /api/reservations/{id}/status:
    put:
      tags: [Reservations]
      summary: 예약 상태 변경
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservationIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationStatusUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }

  /api/reservations/{id}/checkin:
    put:
      tags: [Reservations]
      summary: 매장 체크인 처리(in_progress)
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservationIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCheckinRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }

  /api/checkins:
    get:
      tags: [Checkins]
      summary: 현재 보관중인 짐 목록 조회
      security:
        - StoreBearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }

  /api/checkins/{id}:
    get:
      tags: [Checkins]
      summary: 현재 보관중인 짐 단건 조회
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservationIdPath'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /api/checkins/{id}/checkout:
    put:
      tags: [Checkins]
      summary: 짐 체크아웃(픽업 완료)
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservationIdPath'
