  /api/settlements:
    get:
      tags: [Settlements]
      summary: 정산 내역 조회(점포별)
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }

  /api/settlements/logs:
    get:
      tags: [Settlements]
      summary: 정산 배치 로그 조회
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }

  /api/settlements/errors:
    get:
      tags: [Settlements]
      summary: 정산 에러 로그 조회
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }

  /api/settlements/{id}:
    get:
      tags: [Settlements]
      summary: 정산 상세 조회
      security:
        - StoreBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SettlementIdPath'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

components:
  securitySchemes:
    StoreBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "점포 인증 토큰 (Authorization: Bearer <token>)"
    CustomerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "고객 인증 토큰 (Authorization: Bearer <token>)"

  parameters:
    PageQuery:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    LimitQuery:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    StoreIdPath:
      in: path
      name: storeId
      required: true
      schema: { type: string }
    ReservationIdPath:
      in: path
      name: id
      required: true
      schema: { type: string }
    CouponIdPath:
      in: path
      name: id
      required: true
      schema: { type: string }
    PolicyIdPath:
      in: path
      name: id
      required: true
      schema: { type: string }
    StorageIdPath:
      in: path
      name: id
      required: true
      schema: { type: string }
    NotificationIdPath:
      in: path
      name: id
      required: true
      schema: { type: string }
    ReviewIdPath:
      in: path
      name: id
      required: true
      schema: { type: string }
    PaymentKeyPath:
      in: path
      name: paymentKey
      required: true
      schema: { type: string }
    SettlementIdPath:
      in: path
      name: id
      required: true
      schema: { type: string }

  responses:
    SuccessResponse:
      description: 성공 응답
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
          examples:
            default:
              value:
                success: true
                data: {}
                timestamp: '2026-02-25T10:00:00.000Z'
                message: Success
    ErrorResponse:
      description: 에러 응답
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            default:
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: 유효하지 않은 요청입니다
                  timestamp: '2026-02-25T10:00:00.000Z'
                  details: {}

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data, timestamp]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
        message:
          type: string

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message, timestamp]
          properties:
            code: { type: string }
            message: { type: string }
            timestamp: { type: string, format: date-time }
            details:
              type: object
              additionalProperties: true
            statusCode:
              type: integer

    EmailSendVerificationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    EmailVerifyCodeRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, example: '123456' }

    StoreRegisterRequest:
      type: object
      required: [email, password, businessName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        phoneNumber: { type: string }
        businessNumber: { type: string }
        businessName: { type: string }
        representativeName: { type: string }
        address: { type: string }
        detailAddress: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        businessType:
          type: string
          enum: [RESTAURANT, CAFE, HOTEL, OTHER]
        description: { type: string }

    StoreLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    CustomerSocialLoginRequest:
      type: object
      required: [provider, socialId, accessToken]
      properties:
        provider: { type: string, example: kakao }
        accessToken: { type: string }
        socialAccessToken: { type: string }
        refreshToken: { type: string, description: provider refresh token }
        socialId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        profileImage: { type: string }
        phoneNumber: { type: string }
        birthDate: { type: string, format: date }
        carrier: { type: string }
        gender: { type: string, enum: [M, F] }
        termsAgreed: { type: boolean }
        privacyAgreed: { type: boolean }
        locationAgreed: { type: boolean }
        marketingAgreed: { type: boolean }

    CustomerSignupRequest:
      type: object
      required: [provider]
      properties:
        provider: { type: string, example: kakao }
        socialId: { type: string }
        accessToken: { type: string }
        socialAccessToken: { type: string }
        userId: { type: string }
        customerId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phoneNumber: { type: string }
        profileImage: { type: string }
        birthDate: { type: string, format: date }
        carrier: { type: string }
        gender: { type: string, enum: [M, F] }
        termsAgreed: { type: boolean }
        privacyAgreed: { type: boolean }
        locationAgreed: { type: boolean }
        marketingAgreed: { type: boolean }

    ReservationCreateRequest:
      type: object
      required:
        - storeId
        - customerName
        - phoneNumber
        - startTime
        - duration
        - bagCount
        - storageType
      properties:
        storeId: { type: string }
        customerId: { type: string }
        customerName: { type: string }
        phoneNumber: { type: string }
        email: { type: string, format: email }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        duration: { type: integer, minimum: 1 }
        price: { type: integer, minimum: 0 }
        bagCount: { type: integer, minimum: 1 }
        message: { type: string }
        specialRequests: { type: string }
        luggageImageUrls:
          type: array
          items: { type: string }
        paymentMethod: { type: string, default: card }
        requestTime: { type: string, format: date-time }
        storageType:
          type: string
          enum: [s, m, l, xl, special, refrigeration]

    ReservationStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: confirmed

    ReservationCheckinRequest:
      type: object
      properties:
        photoUrls:
          type: array
          items: { type: string }

    CouponClaimRequest:
      type: object
      required: [type]
      properties:
        customerId: { type: string }
        type:
          type: string
          enum: [payment_discount, store_benefit]
        storeId: { type: string, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        discountAmount: { type: integer, nullable: true }
        discountRate: { type: integer, nullable: true }
        minSpend: { type: integer, nullable: true }
        maxDiscount: { type: integer, nullable: true }
        benefitItem: { type: string, nullable: true }
        benefitValue: { type: string, nullable: true }
        validityDays: { type: integer, default: 7 }

    CouponUseRequest:
      type: object
      properties:
        storeId: { type: string }

    StoreStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, closed, temporarily_closed]
        reason: { type: string }

    StoreInfoUpdateRequest:
      type: object
      properties:
        name: { type: string }
        phoneNumber: { type: string }
        address: { type: string }
        detailAddress: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        description: { type: string }
        hasCompletedSetup: { type: boolean }

    StoreSettingsUpdateRequest:
      type: object
      description: Flutter StoreSettings 모델 구조를 그대로 받는 유연한 스키마
      properties:
        basicInfo:
          type: object
          additionalProperties: true
        operationSettings:
          type: object
          additionalProperties: true
        storageSettings:
          type: object
          additionalProperties: true
        notificationSettings:
          type: object
          additionalProperties: true
        categories:
          type: array
          items:
            type: object
            additionalProperties: true

    CouponPolicyCreateRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [payment_discount, store_benefit]
        discountAmount: { type: integer, nullable: true }
        discountRate: { type: integer, nullable: true }
        minSpend: { type: integer, nullable: true }
        maxDiscount: { type: integer, nullable: true }
        benefitItem: { type: string, nullable: true }
        benefitValue: { type: string, nullable: true }
        autoIssueOn:
          type: string
          enum: [manual_claim, signup, checkin_completed]
          default: manual_claim
        validityDays: { type: integer, default: 7 }
        enabled: { type: boolean, default: true }

    CouponPolicyUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/CouponPolicyCreateRequest'

    StorageCreateRequest:
      type: object
      required: [number, type, pricing]
      properties:
        number: { type: string }
        type:
          type: string
          enum: [s, m, l, xl, special, refrigeration]
        width: { type: integer }
        height: { type: integer }
        depth: { type: integer }
        pricing: { type: integer, minimum: 0 }
        floor: { type: integer }
        section: { type: string }
        row: { type: integer }
        column: { type: integer }

    StorageUpdateRequest:
      type: object
      properties:
        number: { type: string }
        type:
          type: string
          enum: [s, m, l, xl, special, refrigeration]
        status:
          type: string
          enum: [available, occupied, maintenance]
        width: { type: integer }
        height: { type: integer }
        depth: { type: integer }
        pricing: { type: integer, minimum: 0 }
        floor: { type: integer }
        section: { type: string }
        row: { type: integer }
        column: { type: integer }

    ReviewResponseRequest:
      type: object
      required: [response]
      properties:
        response: { type: string }

    PaymentPrepareRequest:
      type: object
      required: [store_id, user_id, amount, order_name]
      properties:
        store_id: { type: string }
        user_id: { type: string }
        amount: { type: integer, minimum: 100 }
        order_name: { type: string }
        customer_email: { type: string, format: email }
        customer_name: { type: string }
        reservation_id: { type: string }

    PaymentConfirmRequest:
      type: object
      required: [paymentKey, orderId, amount]
      properties:
        paymentKey: { type: string }
        orderId: { type: string }
        amount: { type: integer, minimum: 0 }

    PaymentCancelRequest:
      type: object
      required: [cancelReason]
      properties:
        cancelReason: { type: string }

    SettlementRunRequest:
      type: object
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dryRun: { type: boolean, default: false }
